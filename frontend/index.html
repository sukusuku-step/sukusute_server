<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>すくすくステップ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginView" class="login-view">
        <form id="loginForm" class="login-card">
            <h1>すくすくステップ</h1>
            <p>先生用ログイン</p>
            <label>ユーザー名<input id="loginUsername" required autocomplete="username"></label>
            <label>パスワード<input id="loginPassword" type="password" required autocomplete="current-password"></label>
            <button class="primary-button" type="submit">ログイン</button>
            <button id="showRegisterButton" class="text-button" type="button">初めて利用する場合はこちら</button>
            <div id="loginMessage" class="form-message"></div>
        </form>
        <form id="registerForm" class="login-card is-hidden">
            <h1>先生アカウント作成</h1>
            <label>表示名<input id="registerName" required></label>
            <label>ユーザー名<input id="registerUsername" required autocomplete="username"></label>
            <label>パスワード<input id="registerPassword" type="password" required minlength="8" autocomplete="new-password"></label>
            <button class="primary-button" type="submit">アカウントを作成</button>
            <button id="showLoginButton" class="text-button" type="button">ログインに戻る</button>
            <div id="registerMessage" class="form-message"></div>
        </form>
    </div>

    <div id="appView" class="is-hidden">
        <header class="app-header">
            <button id="menuButton" class="menu-button" type="button" aria-label="メニューを開く">
                <span></span><span></span><span></span><small>メニュー</small>
            </button>
            <h1>すくすくステップ</h1>
        </header>
        <main class="dashboard">
            <div class="toolbar">
                <label class="class-selector">
                    <span class="sr-only">クラスを選択</span>
                    <select id="classSelector"></select><span class="select-arrow">▶</span>
                </label>
                <input id="dateSelector" class="date-selector" type="date" aria-label="日付">
            </div>
            <div class="dashboard-layout">
                <section class="students-panel" aria-label="児童の歩数一覧">
                    <div id="studentGrid" class="student-grid"><div class="loading">児童データを読み込み中...</div></div>
                </section>
                <aside class="ranking-panel">
                    <h2>歩数増加ランキング(週)</h2>
                    <ol id="rankingList" class="ranking-list">
                        <li><span>1.</span><strong>-</strong></li><li><span>2.</span><strong>-</strong></li>
                        <li><span>3.</span><strong>-</strong></li><li><span>4.</span><strong>-</strong></li>
                        <li><span>5.</span><strong>-</strong></li>
                    </ol>
                </aside>
            </div>
        </main>
    </div>

    <aside id="menuPanel" class="menu-panel" aria-hidden="true">
        <button id="closeMenuButton" class="close-menu" type="button" aria-label="メニューを閉じる">×</button>
        <button data-action="relation">♧ 関係図を表示</button>
        <button data-action="class">⟳ クラスを変更</button>
        <button data-action="refresh">↻ 情報を更新</button>
        <button data-action="logout">⇥ ログアウト</button>
    </aside>
    <div id="modalLayer" class="modal-layer is-hidden">
        <section id="classModal" class="modal-card is-hidden">
            <button class="modal-close" data-close-modal type="button">×</button>
            <h2>クラスの管理</h2>
            <form id="classForm" class="inline-form"><input id="newClassName" placeholder="新しいクラス名" required><button class="primary-button">追加</button></form>
            <div id="classList" class="class-list"></div>
            <h3>児童の所属クラス</h3>
            <div id="childAssignments" class="class-list"></div>
        </section>
        <section id="relationModal" class="modal-card relation-modal is-hidden">
            <button class="modal-close" data-close-modal type="button">×</button>
            <h2>児童の関係図</h2><p class="modal-caption">距離データがある児童同士を線で結びます。</p>
            <div id="relationGraph" class="relation-graph"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
